services:
  - type: web
    name: projectpilot-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: projectpilot-postgres
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "https://projectpilot-ai.vercel.app,http://localhost:5173"

databases:
  - name: projectpilot-postgres
    databaseName: projectpilot
    user: projectpilot_user
    plan: free
